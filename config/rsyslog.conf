#############################################################################
# syslog.crunchtools.com — central log collector
#
# Ingest paths:
#
#   1. imjournal reads the lotor systemd journal, bind-mounted read-only. Every
#      podman container on lotor uses the journald log driver, and conmon stamps
#      each line with CONTAINER_NAME and SYSLOG_IDENTIFIER. That makes this one
#      source cover the whole fleet with no per-container configuration.
#
#      (Podman has no syslog log driver — only k8s-file, journald, none and
#      passthrough — so forwarding per container the way Docker does is not an
#      option. The journal is the fleet-wide tap.)
#
#   2. imudp / imptcp on 514, for senders that speak syslog directly: processes
#      inside systemd-based containers whose internal logs never reach conmon,
#      and any future host outside lotor.
#
# Output: /logs/<source>/<YYYY-MM-DD>.log, plain text, one line per message.
#############################################################################

global(
    workDirectory="/var/lib/rsyslog"
    maxMessageSize="64k"
)

# The stock 50k-message main queue is sized for a single host's own logs. Give
# the collector room to absorb a fleet-wide burst, but keep it bounded well
# inside the container's 256m cap.
main_queue(
    queue.size="50000"
    queue.dequeueBatchSize="1024"
    queue.workerThreads="2"
)

#############################################################################
# Inputs
#############################################################################

# StateFile persists the journal cursor so a restart resumes where it left off
# rather than replaying gigabytes of history. IgnorePreviousMessages applies
# only to the very first start, before a state file exists.
module(load="imjournal"
       StateFile="imjournal.state"
       IgnorePreviousMessages="on"
       PersistStateInterval="1000"
       Ratelimit.Interval="60"
       Ratelimit.Burst="100000")

# The name= is load-bearing, not decoration: it sets the inputname property, which
# is how the rules below tell a network-forwarded message from a journal one.
module(load="imudp")
input(type="imudp" port="514" name="netsyslog")

module(load="imptcp")
input(type="imptcp" port="514" name="netsyslog")

# Self-statistics. A collector that is running but has silently stopped ingesting
# is the failure mode that matters here; the container check alone would stay
# green. Nagios reads this file — see deploy/nagios/check_syslog_freshness.sh.
# 600s, not 60s. At a one-minute interval these counters were the single largest
# writer in the whole collector (~52 MB/day) — more than the fleet it monitors.
module(load="impstats"
       interval="600"
       resetCounters="off"
       format="json"
       log.syslog="off"
       log.file="/logs/_collector/stats.log")

# Container stdout is arbitrary bytes; invalid UTF-8 would otherwise corrupt the
# output files and break downstream parsing.
module(load="mmutf8fix")

#############################################################################
# Templates
#############################################################################

# <rfc3339 timestamp> <host> <source> <program> <SEVERITY> <message>
#
# Plain text rather than JSON: it stays greppable with ordinary tools, and the
# fixed six-field prefix is a single regex for the MCP server to parse.
#
# program is carried separately from source because they diverge exactly where it
# matters. A systemd container files under its container name, but the message
# might be from httpd, php-fpm or mariadb inside it — without this field, that
# distinction is gone.
template(name="crunchtools_line" type="list") {
    property(name="timereported" dateFormat="rfc3339")
    constant(value=" ")
    property(name="$.host")
    constant(value=" ")
    property(name="$.source")
    constant(value=" ")
    property(name="programname" securepath="replace")
    constant(value=" ")
    property(name="syslogseverity-text" caseconversion="upper")
    constant(value=" ")
    property(name="$.msg")
    constant(value="\n")
}

# securepath="replace" rewrites path separators, so a hostile or malformed
# program name cannot escape /logs into the rest of the filesystem.
#
# The path is bucketed on timegenerated (when the collector received the line)
# rather than timereported (what the sender claimed). A sender with a broken
# clock would otherwise create directories full of 1970 files; the sender's own
# timestamp is still preserved in the line itself.
template(name="crunchtools_path" type="list") {
    constant(value="/logs/")
    property(name="$.source" securepath="replace")
    constant(value="/")
    property(name="timegenerated" dateFormat="rfc3339" position.from="1" position.to="10")
    constant(value=".log")
}

#############################################################################
# Rules
#############################################################################
#
# These run in the default ruleset so that imjournal — which has no input()
# statement to bind — is covered alongside the network listeners.

action(type="mmutf8fix" replacementChar=" ")

# Which stream does this message belong to? The answer differs per ingest path,
# and getting it wrong collapses unrelated services into one file.
if ($!CONTAINER_NAME != "") then {
    # Journal: conmon tagged it with the container name.
    set $.source = $!CONTAINER_NAME;
} else if ($inputname == "netsyslog") then {
    # Network: a systemd container forwarding its internal journal. Key on the
    # sender's hostname, which podman sets to the container name — NOT on the
    # program name, or httpd from every web container would pile into one
    # directory and lose all service attribution.
    set $.source = $hostname;
} else {
    # Host services arriving via the journal (sshd, systemd, podman, kernel).
    set $.source = $programname;
}
if ($.source == "") then {
    set $.source = "unknown";
}

# Drop podman's relay of container output — it is an exact duplicate.
#
# The service units run `podman run` in the FOREGROUND, so systemd captures
# podman's own stdout into the journal under SYSLOG_IDENTIFIER=podman with no
# CONTAINER_NAME, while conmon independently logs the same bytes *with* the
# container name. Every container line therefore lands in the journal twice,
# microseconds apart:
#
#   15:23:11.014584  podman      INFO:httpx:HTTP Request: POST https://...
#   15:23:11.014415  mcp-memory  INFO:httpx:HTTP Request: POST https://...
#
# Left alone this doubles the collector's disk footprint and files half of it
# under "podman" where it is useless — attribution is exactly what the copy
# without CONTAINER_NAME has lost. It also sweeps up podman's API access log,
# which is mostly nagios-agent polling the socket every check interval.
#
# Bounded at notice-and-below so genuine podman daemon failures ("Error: no
# container with ID ... found") still reach the collector. The real fix is
# `podman run -d` / --sdnotify=conmon in the units so nothing is relayed twice;
# this stays correct either way.
if ($programname == "podman" and $!CONTAINER_NAME == "" and $syslogseverity >= 5) then {
    stop
}

# imjournal reports the originating host in _HOSTNAME. For network senders
# rsyslog has already parsed the hostname out of the message itself.
if ($!_HOSTNAME != "") then {
    set $.host = $!_HOSTNAME;
} else {
    set $.host = $hostname;
}

# Journal messages arrive with a trailing newline; RFC3164 network messages
# arrive with a leading space left over from the "tag:" separator. Trimming both
# keeps the five fields single-space delimited no matter which path a message
# took, so one regex parses the whole corpus.
#
# Do not reach for the legacy spifno1stsp option here — in a list template it
# renders as a bare space and silently blanks every message body.
set $.msg = rtrim(ltrim($msg));

# closeTimeout releases idle per-source file handles after 10 minutes. Without it
# rsyslog would hold day-old files open and keep writing to a deleted inode once
# the retention timer compresses them.
action(type="omfile"
       dynaFile="crunchtools_path"
       template="crunchtools_line"
       dirCreateMode="0755"
       fileCreateMode="0640"
       dynaFileCacheSize="200"
       closeTimeout="10"
       flushOnTXEnd="on")
