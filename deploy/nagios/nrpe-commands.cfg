# NRPE command definitions for syslog.crunchtools.com.
# Append to /srv/nagios-agent.crunchtools.com/config/nrpe.cfg and restart
# nagios-agent.crunchtools.com.service.
#
# check_syslog_freshness.sh and check_syslog_disk.sh must be copied into
# /srv/nagios-agent.crunchtools.com/config/scripts/ (mounted read-only into the
# agent at /usr/local/nagios/libexec).

command[check_ctr_run_syslog]=/usr/local/nagios/libexec/check_container_running.sh syslog.crunchtools.com
command[check_ctr_mem_syslog]=/usr/local/nagios/libexec/check_container_memory.sh syslog.crunchtools.com
command[check_tcp_514]=/usr/local/nagios/libexec/check_tcp_local.sh 514
command[check_syslog_freshness]=/usr/local/nagios/libexec/check_syslog_freshness.sh /srv/syslog.crunchtools.com/data/logs 10 30
command[check_syslog_disk]=/usr/local/nagios/libexec/check_syslog_disk.sh /srv/syslog.crunchtools.com/data/logs 10 20
