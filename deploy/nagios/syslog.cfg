# =============================================================================
# syslog.crunchtools.com — Nagios host and service definitions
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/syslog.cfg
#
# Also add ctr-syslog.crunchtools.com to the `infrastructure` hostgroup members
# line in container-hosts.cfg, and append the NRPE commands from nrpe-commands.cfg
# to /srv/nagios-agent.crunchtools.com/config/nrpe.cfg.
#
# Note the ordering of what these checks prove. "Container running" and "Syslog
# port" only show the process is alive; "Ingest freshness" is the one that shows
# it is doing its job. A collector can hold all its ports open and still have
# stopped reading the journal.
# =============================================================================

define host {
    use                 crunchtools-container
    host_name           ctr-syslog.crunchtools.com
    alias               syslog container
    address             10.88.0.1
    check_command       check_nrpe_command!10.88.0.1!check_ctr_run_syslog
}

define service {
    use                     crunchtools-service
    host_name               ctr-syslog.crunchtools.com
    service_description     Memory
    check_command           check_nrpe_command!10.88.0.1!check_ctr_mem_syslog
    notes                   Container capped at 256m; rsyslog idles around 3-5 MB
}

define service {
    use                     crunchtools-service
    host_name               ctr-syslog.crunchtools.com
    service_description     Syslog port
    check_command           check_nrpe_command!10.88.0.1!check_tcp_514
    notes                   TCP 514 published on 127.0.0.1 for host-local senders
}

define service {
    use                     crunchtools-service
    host_name               ctr-syslog.crunchtools.com
    service_description     Ingest freshness
    check_command           check_nrpe_command!10.88.0.1!check_syslog_freshness
    notes                   Fleet-wide log loss detector. Warns at 10m without a write, critical at 30m. If this is red, every container's logs are being dropped even though the container check is green.
}

define service {
    use                     crunchtools-service
    host_name               ctr-syslog.crunchtools.com
    service_description     Log storage
    check_command           check_nrpe_command!10.88.0.1!check_syslog_disk
    notes                   Warn 10GB / critical 20GB under /srv/syslog.crunchtools.com/data/logs. Retention runs daily via syslog-prune.timer.
}

define service {
    use                     crunchtools-service
    host_name               ctr-syslog.crunchtools.com
    service_description     Fleet coverage
    check_command           check_nrpe_command!10.88.0.1!check_syslog_coverage
    notes                   Constitution XIII audit. Alerts only on containers whose log driver is not journald -- those bypass central logging entirely. Containers with no logs yet are reported but do not page, since an idle service is indistinguishable from a broken one here.
}
